<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Einstellungen</title>
<style>
:root{--accent:#bf69a4;--bg:#f7f8fc;--card:#fff;--text:#242536;--muted:#787b90;--line:#e9eaf2;--side:#f0f1f8;--tint:#f4edf8;font:14px system-ui,sans-serif;color:var(--text);background:var(--bg)}*{box-sizing:border-box}body{margin:0}body.dark{--bg:#171923;--card:#222531;--text:#f4f2fa;--muted:#a6a9bd;--line:#343746;--side:#1d202b;--tint:#303040}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button{border:0;background:none}aside{position:fixed;inset:0 auto 0 0;width:235px;background:var(--side);padding:30px 18px;overflow:auto;border-right:1px solid var(--line)}.brand{font-size:19px;font-weight:750;letter-spacing:-.7px;padding:0 14px 28px}.brand span{color:var(--accent)}.profile{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:24px;width:100%;text-align:left}.avatar{display:grid;place-items:center;flex-shrink:0;width:39px;height:39px;background:var(--tint);border-radius:14px;font-size:20px;color:var(--accent)}small,.muted{color:var(--muted)}small{display:block;margin-top:4px;font-size:11px}.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:11px;margin:3px 0;color:var(--muted);font-weight:550}.nav:hover{background:var(--card);color:var(--text)}.nav.active{background:var(--card);color:var(--accent);box-shadow:0 3px 12px #20204005}.symbol{font-size:19px;width:22px;text-align:center}.navlabel{font-size:10px;letter-spacing:1.6px;padding:20px 14px 8px;color:var(--muted)}main{margin-left:235px;padding:32px 42px 80px;max-width:1500px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:36px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:32px;letter-spacing:-1px;margin:8px 0 0;font-weight:720}h2{font-size:17px;margin:0 0 8px;letter-spacing:-.3px}p{line-height:1.7;margin:6px 0 16px}.search{width:260px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:13px 15px;color:var(--text)}.hero{background:linear-gradient(115deg,var(--tint),var(--card));border:1px solid var(--line);border-radius:22px;padding:30px;display:flex;justify-content:space-between;gap:25px;margin-bottom:28px;overflow:hidden}.hero h2{font-size:25px;line-height:1.3;max-width:360px}.hero p{color:var(--muted);max-width:360px}.mini-desktop{width:235px;height:142px;border-radius:13px;background:linear-gradient(135deg,#c9b7e8,#e5b5c7 50%,#b4cce5);padding:18px;box-shadow:0 18px 35px #4a316922;transform:rotate(-4deg);flex-shrink:0}.mini-window{height:100%;width:75%;background:#ffffffcf;border-radius:9px;padding:12px;box-shadow:0 8px 12px #45294514}.dots{color:#ba9aaf;letter-spacing:3px;font-size:12px}.fake-line{height:5px;background:#d8cfdf;border-radius:4px;margin:9px 0;width:85%}.fake-line:last-child{width:55%;background:var(--accent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:23px;margin-bottom:16px}.grid .card{margin:0}.category{width:100%;text-align:left;transition:transform .15s,box-shadow .15s;display:flex;gap:16px;align-items:center}.category:hover{transform:translateY(-2px);box-shadow:0 8px 24px #33335509}.category h2{font-size:15px}.category .icon{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:var(--tint);color:var(--accent);font-size:23px}.category p{font-size:12px;margin:0;color:var(--muted)}.arrow{margin-left:auto;color:var(--muted)}.section{font-size:11px;letter-spacing:1px;color:var(--muted);margin:28px 0 14px;text-transform:uppercase}.row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0;padding-bottom:0}.row:first-child{padding-top:0}.row p{font-size:12px;color:var(--muted);margin:5px 0 0}.primary,.secondary,.danger{border-radius:10px;padding:11px 16px;font-weight:600;display:inline-block}.primary{background:var(--accent);color:white}.secondary{background:var(--tint);color:var(--text)}.danger{background:#ef5c6514;color:#d64a55}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.themes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.theme{padding:14px;border:2px solid var(--line);border-radius:14px;text-align:left}.theme.selected{border-color:var(--accent)}.theme-preview{height:110px;border-radius:8px;padding:18px;background:linear-gradient(135deg,#dfc8ed,#efd3e1);margin-bottom:12px}.theme-preview.night{background:linear-gradient(135deg,#342745,#262d49)}.sample{border-radius:6px;width:70%;height:100%;padding:12px;background:#ffffffd9;color:#30283b}.night .sample{background:#252332;color:#fff}.swatches{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 2px}.swatch{width:31px;height:31px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);color:white;font-weight:700}.swatch.selected{box-shadow:0 0 0 2px var(--accent)}select{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:9px 12px;border-radius:9px;max-width:190px}.toggle{appearance:none;width:42px;height:25px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0}.toggle:before{content:'';position:absolute;width:19px;height:19px;left:3px;top:3px;border-radius:100%;background:white;transition:transform .18s}.toggle:checked{background:var(--accent)}.toggle:checked:before{transform:translateX(17px)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 system-ui;color:var(--muted);margin:15px 0}.wallpaper{width:100%;max-height:310px;object-fit:cover;border-radius:12px;margin:14px 0}.wall-placeholder{height:230px;background:linear-gradient(135deg,#c9b7e8,#e5b5c7,#b4cce5);border-radius:12px;margin:18px 0;display:grid;place-items:center;color:#4d435b}.app{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 0;border-bottom:1px solid var(--line)}.app-name{font-weight:600}.app small{max-width:300px}.app-search{width:100%;margin:15px 0}.toast{position:fixed;bottom:22px;left:calc(50% + 117px);transform:translateX(-50%);padding:12px 20px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 8px 32px #0002;max-width:70%;display:none}.toast.visible{display:block}.empty{padding:50px 20px;text-align:center;color:var(--muted)}@media(max-width:950px){aside{width:205px;padding:24px 12px}main{margin-left:205px;padding:28px 25px 80px}.mini-desktop{width:170px;height:120px}.search{width:210px}.hero{padding:23px}.toast{left:calc(50% + 102px)}}@media(prefers-reduced-motion:reduce){*{transition:none!important;transform:none!important}}
</style></head><body><aside><div class="brand">miracle<span>os</span><small>DEIN DESKTOP. DEIN STIL.</small></div><button class="profile" data-page="Konten"><span class="avatar" id="initial">M</span><span><b id="username">Dein Konto</b><small>Lokales Konto</small></span></button><nav id="nav" aria-label="Einstellungen"></nav></aside><main><header><div><div class="eyebrow">Dein persönlicher Bereich</div><h1 id="heading">Einstellungen</h1></div><input class="search" id="search" type="search" aria-label="Einstellungen durchsuchen" placeholder="Einstellung suchen …"></header><div id="content"></div></main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const categories=[['Übersicht','⌂','Alles an einem Ort'],['Personalisierung','◈','Theme, Farben und Transparenz'],['Hintergrund','▧','Ein neuer Blick auf deinen Desktop'],['System','▣','Gerät, Anmeldung und Wiederherstellung'],['Geräte','⌘','USB und Bluetooth'],['Netzwerk','◎','Verbindungen und Netzwerkadapter'],['Apps','▦','Anwendungen und Fensterfarben'],['Konten','♙','Dein lokales Benutzerkonto'],['Zeit & Sprache','◷','Datum, Zeit und Region'],['Barrierefreiheit','⊕','Lesbarkeit und Darstellung'],['Updates','↻','Versionen und automatische Updates'],['Datenschutz','◇','Deine Daten und Privatsphäre']];
const palette=['#bf69a4','#ec4779','#3d9894','#8183e7','#ad62d7','#e8ae29','#ee9235','#d35c45','#dc3a53','#ab3e79','#2389cc','#226fa8','#36a7ba','#2d9b79','#378957'];
const frames=[['','Globale Farbe'],['#f4ddeb','Rosa'],['#c8e2e1','Türkis'],['#dedff5','Lavendel'],['#e8e8ec','Silber'],['#000000','Schwarz']];
let state={preferences:{accent:'#bf69a4',font_size:12,transparency:true},apps:[],update:{}},page='Übersicht',started=false,serial=0,pending=[],busy=false,info={},toastTimer;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function command(action,key='',value=null){pending.push({id:++serial,action,key,value});pump()}
function pump(){if(busy||!pending.length)return;busy=true;document.title='miracle-settings:'+JSON.stringify(pending[0])}
function ack(id){if(pending[0]?.id===id){pending.shift();busy=false;pump()}}
function toast(text){if(!text)return;$('toast').textContent=text;$('toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),4500)}
window.receiveState=function(next){const old=JSON.stringify(state.preferences),oldUpdate=JSON.stringify(state.update),oldApps=JSON.stringify(state.apps),oldPins=JSON.stringify(state.pins);state=next;document.documentElement.style.setProperty('--accent',state.preferences.accent);document.body.classList.toggle('dark',!!state.preferences.dark);document.documentElement.style.fontSize=(state.preferences.font_size+2)+'px';$('username').textContent=state.user;$('initial').textContent=(state.user||'M')[0].toUpperCase();if(!started){started=true;page=state.page==='Farben'?'Personalisierung':state.page||'Übersicht';navigate(page)}else if(old!==JSON.stringify(state.preferences)||oldUpdate!==JSON.stringify(state.update)||oldApps!==JSON.stringify(state.apps)||oldPins!==JSON.stringify(state.pins)){render()}toast(next.message);ack(next.id)};
window.receiveInfo=function(result){info[result.page]=result.text;if(page===result.page)render();ack(result.id)};
function navigate(next){page=categories.some(c=>c[0]===next)?next:'Übersicht';$('search').value='';render();if(['System','Geräte','Netzwerk','Konten','Zeit & Sprache','Datenschutz'].includes(page))command('info',page)}
function button(text,action,key='',style='secondary'){return `<button class="${style}" data-action="${action}" data-key="${esc(key)}">${esc(text)}</button>`}
function card(title,body){return `<section class="card"><h2>${esc(title)}</h2>${body}</section>`}
function row(title,description,control){return `<div class="row"><div><b>${esc(title)}</b>${description?`<p>${esc(description)}</p>`:''}</div>${control}</div>`}
function frameSelect(key,value,global=false){return `<select aria-label="${global?'Globale Fensterfarbe':'Fensterfarbe für '+esc(key)}" data-frame="${esc(key)}">${frames.map(([v,n])=>`<option value="${v}" ${v===value?'selected':''}>${global&&v===''?'Automatisch':esc(state.preferences.dark?({'Rosa':'Pflaume','Türkis':'Petrol','Lavendel':'Nachtviolett','Silber':'Graphit'}[n]||n):n)}</option>`).join('')}</select>`}
function appearance(){const p=state.preferences;return card('So sieht dein MiracleOS aus',`<p class="muted">Ein heller Start oder ein ruhiger Abend. Du entscheidest.</p><div class="themes">${[false,true].map(d=>`<button class="theme ${p.dark===d?'selected':''}" data-dark="${d}" aria-pressed="${p.dark===d}"><div class="theme-preview ${d?'night':''}"><div class="sample"><b>Aa</b><div class="fake-line"></div><div class="fake-line"></div></div></div>${d?'Dunkel':'Hell'} ${p.dark===d?'✓':''}</button>`).join('')}</div>`)+card('Deine Akzentfarbe',`<p class="muted">Ein Farbtupfer, der dich durch deinen Desktop begleitet.</p><div class="swatches">${palette.map(c=>`<button class="swatch ${c===p.accent?'selected':''}" style="background:${c}" data-accent="${c}" aria-label="Akzentfarbe ${c}" aria-pressed="${c===p.accent}">${c===p.accent?'✓':''}</button>`).join('')}</div>`)+card('Komfort & Lesbarkeit',row('Transparenzeffekt','Glasflächen auf deinem Desktop',`<input type="checkbox" class="toggle" aria-label="Transparenzeffekt" data-pref="transparency" ${p.transparency?'checked':''}>`)+row('Schriftgröße','Für einen entspannten Blick',`<select aria-label="Schriftgröße" data-pref="font_size">${[[10,'Klein'],[12,'Mittel'],[14,'Groß']].map(([v,n])=>`<option value="${v}" ${v===p.font_size?'selected':''}>${n}</option>`).join('')}</select>`))+button('Darstellung zurücksetzen','appearance_reset')}
function render(){const q=$('search').value.toLocaleLowerCase('de');$('heading').textContent=q?'Suchergebnisse':page==='Übersicht'?'Einstellungen':page;$('nav').innerHTML=categories.map(([n,s],i)=>(i===1?'<div class="navlabel">EINSTELLUNGEN</div>':'')+`<button class="nav ${page===n&&!q?'active':''}" data-page="${n}" ${page===n?'aria-current="page"':''}><span class="symbol" aria-hidden="true">${s}</span>${n}</button>`).join('');const p=state.preferences;let html='';
if(q||page==='Übersicht'){let found=categories.filter(c=>c[0]!=='Übersicht'&&(!q||(c.join(' ')+' '+(c[0]==='Personalisierung'?'hell dunkel farben theme schrift glas transparenz':'')).toLocaleLowerCase('de').includes(q)));if(!q)html=`<section class="hero"><div><div class="eyebrow">Ganz wie du</div><h2>Mach es zu<br>deinem MiracleOS.</h2><p>Ein neuer Look, mehr Ruhe, deine Lieblingsfarbe.<br>Hier fühlt sich dein Desktop nach dir an.</p><button class="primary" data-page="Personalisierung">Desktop gestalten <span aria-hidden="true">↗</span></button></div><div class="mini-desktop" aria-hidden="true"><div class="mini-window"><div class="dots">●●●</div><div class="fake-line"></div><div class="fake-line"></div><div class="fake-line"></div></div></div></section><div class="section">Alles im Überblick</div>`;html+=found.length?`<div class="grid">${found.map(([n,s,d])=>`<button class="card category" data-page="${n}"><span class="icon" aria-hidden="true">${s}</span><span><h2>${n}</h2><p>${d}</p></span><span class="arrow">›</span></button>`).join('')}</div>`:'<div class="empty">Keine Einstellung gefunden. Versuche „Farben“, „Apps“ oder „Netzwerk“.</div>';
}else if(page==='Personalisierung'||page==='Barrierefreiheit')html=appearance();
else if(page==='Hintergrund')html=card('Dein Fenster zur Welt',`<p class="muted">Gib deinem Desktop einen Hintergrund, der zu dir passt.</p>${state.wallpaper?`<img class="wallpaper" src="${esc(state.wallpaper)}" alt="Aktueller Desktop-Hintergrund">`:'<div class="wall-placeholder">Dein MiracleOS-Hintergrund</div>'}<p class="muted">${esc(p.wallpaper||'Standard für Hell / Dunkel')}</p><div class="actions">${button('Bild auswählen …','wallpaper','','primary')}${button('Standard für Hell / Dunkel','wallpaper_reset')}</div>`);
else if(page==='Apps'){html=card('Fensterfarben',row('Globale Fensterfarbe','Ein gemeinsamer Rahmen für deine Apps',frameSelect('',p.frame_color||'',true)))+card('Deine Anwendungen',`<p class="muted">Öffnen und die Fensterfarbe jeder App einzeln anpassen.</p><input class="search app-search" id="appSearch" type="search" placeholder="Apps durchsuchen …" aria-label="Apps durchsuchen"><div id="appList"></div><div class="actions">${button('Paketinstaller öffnen','installer')}</div>`)}
else if(page==='Updates'){let u=state.update;html=card('Immer einen Schritt weiter',`<p class="muted">Signierte MiracleOS-Updates für Desktop, Browser und Fenstersystem.</p>${row('Installierte Version',u.installed||'Noch nicht eingerichtet','')}${row('Automatische Updates',u.automatic?'Aktiviert · tägliche Prüfung':'Pausiert','')}<pre>${esc(u.message||'Die Update-Funktion ist auf dieser Installation noch nicht eingerichtet.')}${u.available?'\nVersion: '+esc(u.available):''}${u.checked?'\nLetzte Prüfung: '+esc(u.checked):''}</pre><div class="actions">${button('Prüfen und aktualisieren …','update','apply','primary')}${button('Aktivieren …','update','enable')}${button('Pausieren …','update','disable')}${button('Vorherige Version …','update','rollback')}</div>`)+card('Gut zu wissen','<p class="muted">Laufende Apps bleiben geöffnet. Melde dich nach dem Update erneut an. Debian-Paketupdates werden über die Debian-Paketverwaltung gepflegt. Persönliche Dateien bleiben erhalten.</p>')}
else {html=card(categories.find(c=>c[0]===page)?.[2]||page,`<pre>${esc(info[page]||'Informationen werden geladen …')}</pre>${['Netzwerk','Geräte','Zeit & Sprache'].includes(page)?button('Erneut prüfen','info',page):''}`);if(page==='System')html+=card('Anmeldung & Wiederherstellung',row('Passwort ändern','Sichere dein lokales Konto',button('Passwort ändern …','password'))+row('MiracleOS zurücksetzen','Löscht das Systemlaufwerk und installiert MiracleOS neu. Benötigt die passende ISO.',button('Zurücksetzen …','reset','','danger')))}
$('content').innerHTML=html;if(page==='Apps'&&!q)renderApps('')}
function renderApps(query){$('appList').innerHTML=state.apps.filter(a=>(a.Name+' '+a.Description).toLocaleLowerCase('de').includes(query.toLocaleLowerCase('de'))).map(a=>`<div class="app"><div><button class="app-name" data-action="launch" data-key="${esc(a.ID)}">${esc(a.Name)} ↗</button><small>${esc(a.Description)}</small><div class="actions">${button(state.pins?.[a.ID]?"Von der Leiste lösen":"An die Leiste anheften","pin",a.ID)}${button("Deinstallieren …","uninstall",a.ID,"danger")}</div></div>${frameSelect(a.ID,state.preferences.app_frames?.[a.ID]?.color||'')}</div>`).join('')||'<p class="muted">Keine Anwendungen gefunden.</p>'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)navigate(b.dataset.page);else if(b.dataset.dark)command('save','dark',b.dataset.dark==='true');else if(b.dataset.accent)command('save','accent',b.dataset.accent);else if(b.dataset.action){const a=b.dataset.action;if(['appearance_reset','wallpaper_reset'].includes(a))command('save',a);else command(a,b.dataset.key||'')}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.pref)command('save',el.dataset.pref,el.type==='checkbox'?el.checked:Number(el.value));if(el.dataset.frame!==undefined)command(el.dataset.frame?'app_frame':'save',el.dataset.frame||'frame_color',el.value)});
$('search').addEventListener('input',render);document.addEventListener('input',e=>{if(e.target.id==='appSearch')renderApps(e.target.value)});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();$('search').focus()}if(e.key==='Escape'&&$('search').value){$('search').value='';render()}});
render();command('ready');
</script></body></html>
